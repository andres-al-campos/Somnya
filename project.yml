name: Somnya
options:
  bundleIdPrefix: com.aurende
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: 35DGVFM7WB
    MARKETING_VERSION: "0.4"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic

targets:
  Somnya:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aurende.somnya
        TARGETED_DEVICE_FAMILY: "1"
    # Info.plist lives at the repo root (NOT inside Sources/) so it isn't double-handled as
    # both the plist and a bundled resource — that collision corrupted the built plist down
    # to just the UIBackgroundModes array. The `audio` mode lets the mic keepalive persist
    # with the screen locked (overnight tracking). If launch breaks on the free account,
    # confirm the profile carries background-audio or re-sign cleanly via ReSign.
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSMicrophoneUsageDescription: "Somnya listens for breathing and ambient quiet to track your sleep. Audio is processed on-device."
        NSMotionUsageDescription: "Somnya reads motion, orientation, and barometric pressure to detect movement, sleep posture, and breathing/heartbeat. All processing is on-device."
        UIBackgroundModes:
          - audio
