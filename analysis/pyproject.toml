[project]
name = "somnya-analyze"
version = "0.1.0"
description = "Offline analysis + threshold tuning for Somnya sleep-session CSV exports."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.scripts]
somnya-analyze = "somnya_analyze:main"
somnya-stats = "somnya_analyze.stats:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["somnya_analyze"]
